# Cover Letter Mappings
# Maps each requirement to a paragraph about your experience with that skill/requirement
# This file is gitignored — customize with your own experience descriptions
# Content based on your actual cover letters with a personal, conversational tone

# PERSONALIZED/PASSION SECTIONS
_passion:
  paragraph: "I'm drawn to positions where I can tackle meaningful technical challenges and grow my expertise. I love the problem-solving aspect of software development and am passionate about designing elegant, efficient solutions."

_passion_systems:
  paragraph: "My professional experience in web development has been valuable, but my true passion lies in systems programming. I've been dedicating my free time to learning C, Rust, Zig, and Odin because low-level programming and manual memory management genuinely excite me. I'd love the opportunity to develop this expertise professionally."

_passion_gaming:
  paragraph: "Beyond professional work, I'm passionate about game development and have been building projects in Godot and Odin. I'm particularly fascinated by Entity Component Systems and data-oriented design—these concepts have fundamentally changed how I approach system design. I love the challenge of optimizing for performance in real-time applications."

_passion_learning:
  paragraph: "I love learning new things and am driven to constantly improve. While I've explored many technologies, I'm looking for an opportunity to specialize deeply in one area and develop world-class expertise that provides real value."

# PROFESSIONAL EXPERIENCE & CORE SKILLS
software engineer:
  paragraph: "I have five years of professional experience as a software engineer, gaining expertise in designing and architecting systems. I'm comfortable with the full software development lifecycle and enjoy tackling both high-level architecture and low-level implementation details."

software developer:
  paragraph: "I've spent five years developing production web applications professionally. This experience has given me a solid foundation in delivering real systems that solve actual business problems, but it's also shown me that I want to explore deeper into systems programming."

application developer:
  paragraph: "I've developed applications professionally and have hands-on experience with the entire development process. I enjoy both the architectural design phase and the implementation details that make a system performant and maintainable."

web application developer:
  paragraph: "I've built several production web applications over the last five years, working across the full stack. I appreciate the complexity of real-world systems and the satisfaction of shipping code that people actually use."

# LANGUAGES & PROGRAMMING PARADIGMS
c:
  paragraph: "I consider myself a strong C programmer even though I lack professional experience with it. I've done extensive self-study and built a data-oriented game engine in Odin that relies heavily on C libraries via FFI and custom bindings. I'm love procedural code and enjoy the control low level languages give you over system behavior. Manual memory management is something I find incredibly satisfying rather than frustrating."

c#:
  paragraph: "I have four years of professional experience with C# developing web applications. I'm very comfortable with the .NET ecosystem and have worked extensively with ASP.NET MVC, entity framework, and MSSQL."

python:
  paragraph: "I've worked with Python for scripting and automation tasks. I appreciate its simplicity for rapid development, though it's not my primary focus."

java:
  paragraph: "I have some experience with Java through academic projects and understand the OOP principles well, though I haven't used it extensively in professional work."

rust:
  paragraph: "Rust is one of the languages I've been learning recently as part of my systems programming journey. I appreciate its approach to memory safety, though I find myself drawn more toward the control that C provides."

odin:
  paragraph: "Odin is a language I've been really excited about. I've built my primary personal project—a data-oriented game engine—in Odin and have grown quite comfortable with it. The language's simplicity combined with its power for systems programming makes it my go-to choice for personal projects."

go:
  paragraph: "I've worked with Go and appreciate its pragmatic approach to systems programming. It's a solid choice for backend services and I'm comfortable picking it up as needed."

javascript:
  paragraph: "I have six years of JavaScript experience across the full stack, building interactive frontends and backend services, using both browser based and Node.js. It's been a useful language for web development though not my primary passion."

typescript:
  paragraph: "I've used TypeScript in both frontend and backend contexts. I appreciate the type safety it brings to JavaScript, especially in larger codebases."

